<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="주기 촬영">
<title>현장 주기 촬영 | 충북대학교 안전공학과</title>
<link rel="icon" href="assets/cbnu.png">
<style>
:root{
  --primary:#0F6FFF; --bg:#FFFFFF; --canvas:#EEF1F5; --surface:#FFFFFF; --text:#1C1C1C; --caption:#737373;
  --border:#E2E4E9; --ok:#15B874; --warn:#FFA833; --err:#E63B3B;
  --font:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Noto Sans KR",-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --primary:#3F8CFF; --bg:#1D1F24; --canvas:#15171C; --surface:#1D1F24; --text:#EBECED; --caption:#8A8A8A; --border:#333741;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--text);font:15px/1.5 var(--font);
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{max-width:960px;margin:0 auto;display:grid;gap:16px}
h1{font-size:20px;margin:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
label{display:grid;gap:4px;font-size:13px;color:var(--caption)}
input,select,button{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;min-height:44px}
input[type=checkbox]{min-height:0;width:20px;height:20px}
button{cursor:pointer;font-weight:600}
button.primary{background:var(--primary);border-color:var(--primary);color:#fff}
button.stop{background:var(--err);border-color:var(--err);color:#fff}
button:disabled{opacity:.5;cursor:default}
.tgl{display:inline-flex;align-items:center;gap:10px;padding:6px 14px 6px 8px;border-radius:9999px}
.tgl .knob{position:relative;width:44px;height:26px;border-radius:9999px;background:var(--caption);transition:background .15s;flex:none}
.tgl .knob::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.tgl[aria-checked=true]{border-color:var(--ok)}
.tgl[aria-checked=true] .knob{background:var(--ok)}
.tgl[aria-checked=true] .knob::after{transform:translateX(18px)}
.tgl b{font-weight:700}
.tgl[aria-checked=true] b{color:var(--ok)}
input[type=url]{width:100%}
.shots figcaption.sent::after{content:" ✓";color:var(--ok)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--text)}
.preview{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:4/3}
video{width:100%;height:100%;object-fit:contain;display:block}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.on{animation:flash .25s}
@keyframes flash{from{opacity:.8}to{opacity:0}}
.stats{display:flex;flex-wrap:wrap;gap:16px;font-size:14px}
.stats b{font-variant-numeric:tabular-nums}
.badge{padding:2px 10px;border-radius:9999px;font-size:12px;font-weight:700;color:#fff;background:var(--caption)}
.badge.run{background:var(--ok)} .badge.warn{background:var(--warn)} .badge.err{background:var(--err)}
.msg{font-size:13px;color:var(--caption);min-height:20px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.shots figure{margin:0;position:relative}
.shots img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block;background:var(--canvas)}
.shots figcaption{font-size:11px;color:var(--caption);text-align:center}
</style>
</head>
<body>
<main>
  <div class="row"><a href="./" style="color:var(--primary);text-decoration:none;font-weight:600">← 안전문서 생성으로</a></div>
  <h1>현장 주기 촬영 <span id="state" class="badge">대기</span></h1>

  <section class="card">
    <div class="grid">
      <label>촬영 간격
        <span class="row"><input id="every" type="number" min="1" value="5" style="width:80px">
          <select id="unit"><option value="1">초</option><option value="60" selected>분</option><option value="3600">시간</option></select></span>
      </label>
      <label>총 촬영 시간 (0 = 계속)
        <span class="row"><input id="total" type="number" min="0" value="0" style="width:80px"><span>시간</span></span>
      </label>
      <label>카메라
        <select id="facing"><option value="environment">후면</option><option value="user">전면</option></select>
      </label>
      <label>해상도
        <select id="res"><option value="1280">1280 (HD)</option><option value="1920" selected>1920 (FHD)</option><option value="3840">3840 (4K)</option></select>
      </label>
    </div>
    <div class="grid" style="margin-top:12px">
      <label style="grid-column:1/-1">전송 주소 (사진을 POST로 보낼 서버, multipart: photo·takenAt)
        <input id="url" type="url" inputmode="url" placeholder="https://example.com/upload">
      </label>
    </div>
    <div class="row" style="margin-top:12px;gap:16px">
      <label class="check"><input id="stamp" type="checkbox" checked>사진에 촬영 시각 넣기</label>
      <label class="check"><input id="shutter" type="checkbox" checked>촬영 때 화면 깜빡임</label>
    </div>
  </section>

  <section class="card" style="display:grid;gap:12px">
    <div class="preview"><video id="video" playsinline muted autoplay></video><div id="flash" class="flash"></div></div>
    <div class="stats">
      <span>촬영 <b id="count">0</b>장</span>
      <span>다음 촬영까지 <b id="next">-</b></span>
      <span>경과 <b id="elapsed">-</b></span>
      <span>전송 완료 <b id="sentc">0</b> · 대기 <b id="pendc">0</b></span>
    </div>
    <div class="row">
      <button id="tglRun" class="tgl" role="switch" aria-checked="false"><span class="knob"></span>인터벌 촬영 <b>꺼짐</b></button>
      <button id="tglSend" class="tgl" role="switch" aria-checked="false"><span class="knob"></span>전송 <b>꺼짐</b></button>
      <button id="snap">지금 한 장</button>
    </div>
    <div id="msg" class="msg">시작을 누르면 카메라 사용 허용 창이 뜹니다. 촬영 중에는 이 화면을 켜 둔 채 앞에 두세요.</div>
  </section>

  <section class="card" style="display:grid;gap:12px">
    <div class="row">
      <strong style="flex:1">저장된 사진 <span id="saved" style="color:var(--caption);font-weight:400"></span></strong>
      <button id="share">공유 / 사진에 저장</button>
      <button id="dl">다운로드</button>
      <button id="clear">모두 삭제</button>
    </div>
    <div id="shots" class="shots"></div>
  </section>
</main>

<script>
/* 주기 촬영 — 페이지가 앞에 떠 있는 동안 N초/분/시간마다 한 장씩 찍어 기기(IndexedDB)에 저장한다.
   iPad Safari는 화면이 꺼지거나 다른 앱·탭으로 가면 카메라가 멈춘다 → Wake Lock + 자동 복구.
   '인터벌 촬영' 단추로 주기 촬영을, '전송' 단추로 서버 전송(POST multipart: photo, takenAt)을 각각 켜고 끈다.
   전송을 꺼 두면 기기에만 저장하고, 다시 켜면 아직 못 보낸 사진부터 차례로 보낸다. */

const $ = id => document.getElementById(id);
const els = Object.fromEntries(["every","unit","total","facing","res","stamp","shutter","video","flash","count","next","elapsed","tglRun","tglSend","url","sentc","pendc","snap","msg","state","shots","saved","share","dl","clear"].map(k => [k, $(k)]));
let stream = null, wake = null, running = false, timer = null, tick = null;
let startedAt = 0, nextAt = 0, endAt = 0, taken = 0, busy = false;

/* ---------- IndexedDB ---------- */
const dbp = new Promise((ok, no) => {
  const r = indexedDB.open("interval-camera", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("shots", { keyPath: "id", autoIncrement: true });
  r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
});
const tx = async (mode, fn) => {
  const db = await dbp;
  return new Promise((ok, no) => { const t = db.transaction("shots", mode); const res = fn(t.objectStore("shots")); t.oncomplete = () => ok(res.result); t.onerror = () => no(t.error); });
};
const putShot = s => tx("readwrite", st => st.add(s));
const updShot = s => tx("readwrite", st => st.put(s));
const allShots = () => tx("readonly", st => st.getAll());
const clearShots = () => tx("readwrite", st => st.clear());

/* ---------- 화면 표시 ---------- */
const setToggle = (btn, on) => { btn.setAttribute("aria-checked", on); btn.querySelector("b").textContent = on ? "켜짐" : "꺼짐"; };
let sendOn = false, flushing = false;
try { els.url.value = localStorage.getItem("cam.url") || ""; } catch {}
els.url.addEventListener("change", () => { try { localStorage.setItem("cam.url", els.url.value.trim()); } catch {} });
const fmt = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h?h+":":"") + String(m).padStart(h?2:1,"0") + ":" + String(x).padStart(2,"0"); };
const say = (t, cls) => { els.msg.textContent = t; if (cls !== undefined) setState(cls[0], cls[1]); };
const setState = (text, cls="") => { els.state.textContent = text; els.state.className = "badge " + cls; };
const stamp = d => d.toLocaleString("ko-KR", { hour12:false }).replace(/\s+/g," ");

async function renderShots() {
  const list = await allShots();
  els.saved.textContent = list.length ? `(${list.length}장)` : "";
  const done = list.filter(s => s.sent).length; els.sentc.textContent = done; els.pendc.textContent = list.length - done;
  els.shots.replaceChildren(...list.slice(-60).reverse().map(s => {
    const f = document.createElement("figure"), i = document.createElement("img"), c = document.createElement("figcaption");
    i.src = URL.createObjectURL(s.blob); i.onload = () => URL.revokeObjectURL(i.src); i.alt = ""; c.textContent = stamp(new Date(s.takenAt)); if (s.sent) c.className = "sent";
    f.append(i, c); return f;
  }));
}

/* ---------- 카메라 ---------- */
async function openCamera() {
  closeCamera();
  const w = +els.res.value;
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: els.facing.value }, width: { ideal: w }, height: { ideal: Math.round(w*3/4) } }, audio: false
  });
  els.video.srcObject = stream;
  await els.video.play().catch(() => {});
  stream.getVideoTracks()[0].addEventListener("ended", () => { if (running) say("카메라가 멈췄습니다. 자동으로 다시 켭니다…", ["복구 중","warn"]); });
}
function closeCamera() { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; els.video.srcObject = null; }
const cameraAlive = () => stream && stream.getVideoTracks().some(t => t.readyState === "live") && els.video.videoWidth > 0;

async function lockScreen() {
  try { if ("wakeLock" in navigator && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => wake = null); } }
  catch { /* 지원 안 함/거부: 설정 > 디스플레이 및 밝기 > 자동 잠금 '안 함'으로 대체 */ }
}

/* ---------- 촬영 ---------- */
async function capture(manual) {
  if (busy) return; busy = true;
  try {
    if (!cameraAlive()) await openCamera();
    await new Promise(r => requestAnimationFrame(r));
    const v = els.video, c = document.createElement("canvas");
    c.width = v.videoWidth; c.height = v.videoHeight;
    const g = c.getContext("2d"); g.drawImage(v, 0, 0);
    const now = new Date();
    if (els.stamp.checked) {
      const size = Math.max(16, Math.round(c.height / 36)); g.font = `600 ${size}px sans-serif`; g.textBaseline = "bottom";
      const t = stamp(now), pad = size/2, w = g.measureText(t).width;
      g.fillStyle = "rgba(0,0,0,.55)"; g.fillRect(pad/2, c.height - size - pad*1.5, w + pad*1.5, size + pad*1.2);
      g.fillStyle = "#fff"; g.fillText(t, pad, c.height - pad);
    }
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.9));
    if (!blob) throw new Error("이미지 생성 실패");
    await putShot({ blob, takenAt: now.getTime(), sent: false });
    taken++; els.count.textContent = taken;
    if (els.shutter.checked) { els.flash.classList.remove("on"); void els.flash.offsetWidth; els.flash.classList.add("on"); }
    renderShots();
    if (sendOn) flush();
    if (running) say(`${stamp(now)} 촬영 완료`, ["촬영 중","run"]);
  } catch (e) {
    say("촬영 실패: " + (e.name === "NotAllowedError" ? "카메라 권한이 거부되었습니다. 설정 > Safari > 카메라에서 허용해 주세요." : e.message), ["오류","err"]);
  } finally { busy = false; }
}
async function flush() {                                   // 못 보낸 사진을 오래된 순으로 전송
  if (flushing || !sendOn) return; flushing = true;
  try {
    for (const s of (await allShots()).filter(x => !x.sent)) {
      if (!sendOn) break;
      const f = new FormData(); f.append("photo", s.blob, `shot-${s.takenAt}.jpg`); f.append("takenAt", new Date(s.takenAt).toISOString());
      const r = await fetch(els.url.value.trim(), { method: "POST", body: f });
      if (!r.ok) throw new Error("HTTP " + r.status);
      await updShot({ ...s, sent: true }); renderShots();
    }
  } catch (e) { say("전송 실패(기기에는 저장됨, 다음 촬영·재시도 때 다시 보냅니다): " + e.message, ["전송 오류","err"]); }
  finally { flushing = false; }
}

/* ---------- 타이머 (시계 기준으로 보정해 간격이 밀리지 않게) ---------- */
function schedule() {
  clearTimeout(timer);
  const every = Math.max(1, +els.every.value || 1) * +els.unit.value * 1000;
  timer = setTimeout(async () => {
    if (!running) return;
    if (endAt && Date.now() >= endAt) return stop("정해 둔 촬영 시간이 끝났습니다.");
    await capture();
    nextAt = Math.max(nextAt + every, Date.now() + 1000);   // 밀렸으면 건너뛰고 다음 칸으로
    schedule();
  }, Math.max(0, nextAt - Date.now()));
}
async function start() {
  if (!navigator.mediaDevices?.getUserMedia) return say("이 브라우저는 카메라를 지원하지 않거나 HTTPS가 아닙니다.", ["오류","err"]);
  try { await openCamera(); } catch (e) { return say("카메라를 켤 수 없습니다: " + e.message, ["오류","err"]); }
  await lockScreen();
  running = true; taken = 0; els.count.textContent = 0; startedAt = Date.now();
  const hours = +els.total.value || 0; endAt = hours ? startedAt + hours*3600*1000 : 0;
  setToggle(els.tglRun, true);
  [els.every, els.unit, els.total, els.facing, els.res].forEach(x => x.disabled = true);
  await capture();                         // 시작하자마자 첫 장
  nextAt = Date.now() + Math.max(1, +els.every.value || 1) * +els.unit.value * 1000;
  schedule();
  tick = setInterval(() => {
    els.next.textContent = fmt((nextAt - Date.now())/1000);
    els.elapsed.textContent = fmt((Date.now() - startedAt)/1000);
  }, 500);
  say("촬영 중입니다. 이 화면을 켜 둔 채 앞에 두세요.", ["촬영 중","run"]);
}
function stop(reason) {
  running = false; clearTimeout(timer); clearInterval(tick); closeCamera();
  if (wake) { wake.release().catch(() => {}); wake = null; }
  setToggle(els.tglRun, false);
  [els.every, els.unit, els.total, els.facing, els.res].forEach(x => x.disabled = false);
  els.next.textContent = "-";
  say((typeof reason === "string" ? reason : "중지했습니다.") + ` 총 ${taken}장 촬영.`, ["대기",""]);
}

/* 화면이 꺼졌다 돌아오면(숨김→보임) 화면 유지·카메라를 되살리고, 놓친 시간을 알려 준다 */
document.addEventListener("visibilitychange", async () => {
  if (!running) return;
  if (document.hidden) { say("화면이 가려져 촬영이 멈췄습니다. 앞으로 돌아오면 이어서 찍습니다.", ["일시 정지","warn"]); return; }
  await lockScreen();
  if (!cameraAlive()) { try { await openCamera(); } catch (e) { return say("카메라 복구 실패: " + e.message, ["오류","err"]); } }
  if (nextAt < Date.now()) { nextAt = Date.now(); schedule(); }   // 놓친 간격은 건너뛰고 바로 한 장
  say("촬영을 이어갑니다.", ["촬영 중","run"]);
});

/* ---------- 내보내기 ---------- */
const fileOf = s => new File([s.blob], `shot-${new Date(s.takenAt).toISOString().replace(/[:.]/g,"-")}.jpg`, { type: "image/jpeg" });
els.share.onclick = async () => {                       // iPad: 공유 시트 → '이미지 저장'으로 사진 앱에 담기
  const files = (await allShots()).map(fileOf);
  if (!files.length) return say("저장된 사진이 없습니다.");
  if (navigator.canShare?.({ files })) { try { await navigator.share({ files }); } catch {} }
  else say("이 브라우저는 파일 공유를 지원하지 않습니다. '다운로드'를 쓰세요.");
};
els.dl.onclick = async () => {
  for (const s of await allShots()) { const a = document.createElement("a"), f = fileOf(s); a.href = URL.createObjectURL(f); a.download = f.name; a.click(); await new Promise(r => setTimeout(r, 250)); URL.revokeObjectURL(a.href); }
};
els.clear.onclick = async () => { if (confirm("저장된 사진을 모두 삭제할까요?")) { await clearShots(); renderShots(); } };

els.tglRun.onclick = () => running ? stop() : start();
els.tglSend.onclick = () => {
  if (sendOn) { sendOn = false; setToggle(els.tglSend, false); return say("전송을 껐습니다. 이후 사진은 기기에만 저장됩니다."); }
  let u; try { u = new URL(els.url.value.trim()); if (!/^https?:$/.test(u.protocol)) throw 0; } catch { return say("전송 주소를 먼저 올바르게 입력해 주세요(https://…).", ["오류","err"]); }
  try { localStorage.setItem("cam.url", u.href); } catch {}
  sendOn = true; setToggle(els.tglSend, true); say("전송을 켰습니다. 못 보낸 사진부터 보냅니다."); flush();
}; els.snap.onclick = async () => { if (!stream) { try { await openCamera(); } catch (e) { return say("카메라를 켤 수 없습니다: " + e.message); } } await capture(true); if (!running) closeCamera(); };
renderShots();
</script>
</body>
</html>
