, yuklash"], "cls": ["인간공학적 요인", "Ergonomic", "人体工学因素", "Yếu tố công thái học", "Ergonomik omil"], "cause": ["요통·근골격계 손상, 낙하물에 맞음·발등 협착", "Back and musculoskeletal injury; dropped load striking feet", "腰痛·肌肉骨骼损伤，落物砸伤·脚背夹压", "Đau lưng, tổn thương cơ xương; vật rơi vào chân", "Bel va tayanch-harakat jarohati; tushgan yuk oyoqni uradi"], "haz": ["40kg가 넘는 시멘트 포대·자재를 혼자 허리를 굽혀 들어 올리고, 계단을 오르며 시야가 가려진다. 허리 손상뿐 아니라 균형을 잃으면 자재를 발등에 떨어뜨리거나 계단에서 함께 굴러떨어진다.", "A worker alone bends at the waist to lift cement bags or material over 40 kg and climbs stairs with the load blocking his view. Beyond back injury, a loss of balance drops the load on his feet or sends both down the stairs.", "单人弯腰抬举超过40kg的水泥袋·材料，登楼梯时视线被遮挡。除腰部损伤外，失去平衡时材料砸伤脚背或连人带物滚落楼梯。", "Một người khom lưng nâng bao xi măng, vật liệu trên 40 kg và leo cầu thang bị che tầm nhìn. Ngoài tổn thương lưng, mất thăng bằng làm vật rơi vào chân hoặc cả người lẫn vật lăn xuống.", "Ishchi yolg'iz belini bukib 40 kg dan og'ir sement qopi yoki materialni ko'taradi va yuk ko'rishni to'sgan holda zinadan chiqadi. Bel jarohatidan tashqari muvozanat yo'qolsa yuk oyoqqa tushadi yoki ikkalasi zinadan dumalaydi."], "law": ["안전보건규칙 제663조 [중량물의 제한]·제665조 [중량의 표시 등]·제666조 [작업자세 등]·제385조 [중량물 취급] / 근골격계부담작업 고시", "OSH Rule Art.663 [limits on heavy loads], Art.665 [weight marking], Art.666 [working posture], Art.385 / MSD-burden work notice", "安全保健规则 第663条[重物的限制]·第665条[重量的标示等]·第666条[作业姿势等]·第385条[重物搬运] / 肌肉骨骼负担作业告示", "Quy chuẩn Điều 663 [giới hạn vật nặng], Điều 665 [ghi trọng lượng], Điều 666 [tư thế], Điều 385", "Qoidalar 663-modda [og'ir yuk chegarasi], 665-modda [og'irlik belgisi], 666-modda [ish holati], 385-modda"], "csi": ["CSI 운반작업 중 사고 2,804건 사망 62명 — 외국인 근로자 360건; 물체에 맞음·끼임의 상당수가 인력 운반 중 발생", "CSI: 2,804 cases during manual transport, 62 deaths — 360 involved foreign workers; many struck-by and caught-in cases occur while carrying", "CSI 搬运作业中事故2,804起 死亡62人 — 外籍劳工360起；物体打击·夹压中相当部分发生于人力搬运", "CSI: 2.804 vụ khi vận chuyển, 62 tử vong — 360 vụ lao động nước ngoài; nhiều vụ vật rơi, kẹp xảy ra khi khuân vác", "CSI: tashishda 2 804 holat, 62 o'lim — chet ellik ishchilar 360; jism urishi va qisilishning ko'pi qo'lda tashishda"], "cur": ["1인 운반, 시야 가림, 허리 굽힘", "One-person carry, view blocked, bent back", "单人搬运，视线遮挡，弯腰", "Một người mang, che tầm nhìn, khom lưng", "Bir kishi tashiydi, ko'rish to'silgan, bel bukilgan"], "act": ["① 25kg 초과 자재는 2인 이상 또는 대차·리프트 등 운반기구 사용 ② 무릎을 굽혀 허리를 편 자세로 들고, 몸 가까이 붙여 운반 ③ 자재에 중량·취급 방법을 표시하고 운반 경로의 장애물 제거 ④ 시야가 가려지는 크기는 분할하거나 2인 운반", "(1) Use two or more people or a trolley or lift for anything over 25 kg. (2) Lift with bent knees and a straight back, holding the load close to the body. (3) Mark weight and handling method on materials and clear the route. (4) Split loads that block the view or carry them in pairs.", "① 超过25kg的材料由两人以上或使用手推车·升降机等搬运工具 ② 屈膝直腰抬举并贴近身体搬运 ③ 在材料上标示重量·搬运方法并清除搬运路线障碍 ④ 遮挡视线的尺寸应分割或两人搬运", "(1) Trên 25 kg dùng ≥2 người hoặc xe đẩy, thang nâng. (2) Gập gối, thẳng lưng, giữ vật sát người. (3) Ghi trọng lượng, cách mang lên vật liệu; dọn chướng ngại trên đường. (4) Vật che tầm nhìn thì chia nhỏ hoặc hai người mang.", "(1) 25 kg dan og'ir yukka kamida ikki kishi yoki aravacha, lift. (2) Tizzani bukib, belni to'g'ri tutib, yukni tanaga yaqin ko'tarish. (3) Materialga og'irlik va tashish usulini yozish, yo'ldagi to'siqlarni olish. (4) Ko'rishni to'suvchi yukni bo'lish yoki ikki kishi tashish."], "p": 3, "s": 1, "p2": 1, "s2": 1}, "p94": {"supp": [], "safe": [12, 13]}}, {"id": "G20", "e": null, "p": null, "dom": "gen", "grp": ["환경", "환경", "환경", "환경", "환경"], "tag": ["폭염 노출 — 그늘·물·휴식 없이 옥외 작업", "Heat exposure — outdoor work with no shade, water or rest", "高温暴露 — 无遮阳·饮水·休息的室外作业", "Nắng nóng — làm ngoài trời không bóng mát, nước, nghỉ", "Jazirama — soyasiz, suvsiz va dam olishsiz ochiq havoda ish"], "ra": {"work": ["여름철 옥외 철근·콘크리트·포장 작업", "Summer outdoor rebar, concrete and paving work", "夏季室外钢筋·混凝土·铺装作业", "Làm thép, bê tông, lát đường ngoài trời mùa hè", "Yozda ochiq havoda armatura, beton, yotqizish ishi"], "cls": ["물리적 요인(온열)", "Physical (heat)", "物理性因素(高温)", "Yếu tố vật lý (nhiệt)", "Fizik omil (issiqlik)"], "cause": ["온열질환 — 열사병·열탈진, 의식 저하로 2차 재해", "Heat illness — heat stroke or exhaustion, secondary accidents from impaired awareness", "热病 — 中暑·热衰竭，意识下降引发二次事故", "Bệnh nhiệt — say nắng, kiệt sức; tai nạn thứ cấp do giảm ý thức", "Issiqlik kasalligi — issiqlik urishi, holsizlik; hushsizlikdan ikkilamchi hodisa"], "haz": ["체감온도 33℃가 넘는 한낮에 그늘막·음료 없이 옥외 콘크리트 타설을 계속한다. 방진마스크와 안전모 안에 열이 갇혀 체온이 오르고, 어지러움으로 균형을 잃으면 고소·장비 주변에서 2차 재해로 이어진다.", "Outdoor concrete work continues through midday above a 33 °C heat index with no shade or drinks. Heat builds inside the dust mask and helmet, and dizziness near height or machinery turns into a secondary accident.", "体感温度超过33℃的正午无遮阳棚·饮料仍持续室外混凝土浇筑。热量积聚于防尘口罩与安全帽内使体温上升，眩晕失去平衡时在高处·设备周边引发二次事故。", "Đổ bê tông ngoài trời giữa trưa với nhiệt độ cảm nhận trên 33 °C, không mái che, không nước. Nhiệt tích trong khẩu trang, mũ làm thân nhiệt tăng; chóng mặt mất thăng bằng gần độ cao, máy móc dẫn tới tai nạn thứ cấp.", "His qilinadigan harorat 33 °C dan yuqori tush paytida soyabon va ichimliksiz ochiq havoda beton ishi davom etadi. Niqob va qalpoq ichida issiqlik to'planib tana harorati ko'tariladi; bosh aylanishi balandlik yoki mashina yonida ikkilamchi hodisaga olib keladi."], "law": ["안전보건규칙 제566조 [휴식 등]·제567조 [휴게시설의 설치]·제559조 [고열작업 등]·제571조 [소금과 음료수 등의 비치] / 2025.6 개정 폭염작업 기준(체감온도 33℃ 이상 2시간마다 20분 휴식)", "OSH Rule Art.566 [rest], Art.567 [rest facilities], Art.559 [hot work], Art.571 [salt and drinks] / 2025.6 heat-wave rule (heat index ≥33 °C: 20 min rest every 2 h)", "安全保健规则 第566条[休息等]·第567条[休息设施的设置]·第559条[高热作业等]·第571条[盐和饮料等的配备] / 2025.6修订高温作业基准(体感温度33℃以上每2小时休息20分钟)", "Quy chuẩn Điều 566 [nghỉ], Điều 567 [nơi nghỉ], Điều 559, Điều 571 [muối, nước] / Quy định nắng nóng 2025.6 (≥33 °C: nghỉ 20 phút mỗi 2 giờ)", "Qoidalar 566-modda [dam olish], 567-modda [dam olish joyi], 559-, 571-modda / 2025.6 jazirama qoidasi (≥33 °C: har 2 soatda 20 daqiqa dam)"], "csi": ["CSI 온열질환 20건 사망 3명(치명률 15.0%) — 외국인 근로자 7건(35.0%)으로 외국인 비중이 전체 평균 13.8%의 2.5배", "CSI: 20 heat-illness cases, 3 deaths (15.0%) — 7 involved foreign workers (35.0%), 2.5× the 13.8% overall share", "CSI 热病20起 死亡3人(致死率15.0%) — 外籍劳工7起(35.0%)，外籍比重为整体平均13.8%的2.5倍", "CSI: 20 vụ bệnh nhiệt, 3 tử vong (15,0%) — 7 vụ lao động nước ngoài (35,0%), gấp 2,5 lần mức 13,8%", "CSI: issiqlik kasalligi 20 holat, 3 o'lim (15,0%) — chet ellik ishchilar 7 (35,0%), umumiy 13,8% dan 2,5 baravar"], "cur": ["그늘막·음료·휴식 없음, 한낮 연속 작업", "No shade, drinks or rest; continuous midday work", "无遮阳·饮料·休息，正午连续作业", "Không bóng mát, nước, nghỉ; làm liên tục giữa trưa", "Soya, ichimlik va dam yo'q; tush paytida uzluksiz ish"], "act": ["① 체감온도 33℃ 이상이면 2시간마다 20분 이상 그늘에서 휴식, 35℃ 이상이면 14~17시 옥외작업 중지 검토 ② 작업장 가까이 그늘막·휴게시설과 시원한 물·이온음료 상시 비치 ③ 온열질환 증상(어지러움·구토·의식저하)과 응급조치를 다국어로 교육, 2인 1조로 상호 관찰 ④ 무더위 시간대를 피해 작업시간 조정", "(1) At a heat index of 33 °C or more, rest at least 20 minutes in shade every 2 hours; at 35 °C or more consider stopping outdoor work 14:00–17:00. (2) Keep shade, rest facilities, cool water and electrolyte drinks close to the work area. (3) Teach heat-illness signs (dizziness, vomiting, confusion) and first aid multilingually; work in pairs and watch each other. (4) Reschedule work away from the hottest hours.", "① 体感温度33℃以上时每2小时在阴凉处休息20分钟以上，35℃以上时考虑停止14~17时室外作业 ② 作业场附近常备遮阳棚·休息设施与凉水·电解质饮料 ③ 以多语种教育热病症状(眩晕·呕吐·意识下降)与急救措施，两人一组相互观察 ④ 避开酷热时段调整作业时间", "(1) Nhiệt độ cảm nhận ≥33 °C: nghỉ ≥20 phút trong bóng mát mỗi 2 giờ; ≥35 °C cân nhắc dừng việc ngoài trời 14–17 giờ. (2) Mái che, nơi nghỉ, nước mát, nước điện giải gần nơi làm. (3) Huấn luyện đa ngữ dấu hiệu (chóng mặt, nôn, lơ mơ) và sơ cứu; làm theo cặp, quan sát nhau. (4) Điều chỉnh giờ làm tránh giờ nóng nhất.", "(1) His qilinadigan harorat ≥33 °C da har 2 soatda kamida 20 daqiqa soyada dam; ≥35 °C da 14–17 da ochiq ishni to'xtatishni ko'rib chiqish. (2) Ish joyi yonida soyabon, dam olish joyi, salqin suv va elektrolit ichimlik. (3) Belgilarni (bosh aylanishi, qusish, hushsizlik) va birinchi yordamni ko'p tilda o'rgatish; juftlikda bir-birini kuzatish. (4) Eng issiq soatlardan qochib ish vaqtini o'zgartirish."], "p": 2, "s": 2, "p2": 1, "s2": 2}, "p94": {"supp": [], "safe": [12, 13, 14]}}], "grp": {"전기": ["전기적 위험 표지", "Electrical indicators", "电气性危险标志", "Dấu hiệu nguy hiểm điện", "Elektr xavf belgilari"], "보호구": ["보호구 표지", "PPE indicators", "保护具标志", "Dấu hiệu PTBVCN", "Himoya vositasi belgilari"], "환경": ["작업환경 표지", "Environment indicators", "作业环境标志", "Dấu hiệu môi trường", "Ish muhiti belgilari"], "가공전선": ["가공전선 관련 표지", "Overhead-line indicators", "架空线路相关标志", "Dấu hiệu đường dây trên không", "Havo liniyasi belgilari"], "고소": ["고소작업 표지", "Work-at-height indicators", "高处作业标志", "Dấu hiệu làm việc trên cao", "Balandlikdagi ish belgilari"], "밀폐": ["밀폐공간 표지", "Confined-space indicators", "密闭空间标志", "Dấu hiệu không gian kín", "Yopiq joy belgilari"], "굴착": ["굴착 표지", "Excavation indicators", "挖掘标志", "Dấu hiệu đào đất", "Qazish belgilari"], "화기": ["화기작업 표지", "Hot-work indicators", "动火作业标志", "Dấu hiệu làm việc có lửa", "Olovli ish belgilari"], "관리": ["관리적 표지", "Management indicators", "管理性标志", "Dấu hiệu quản lý", "Boshqaruv belgilari"], "추락": ["추락 위험 표지", "Fall-from-height indicators", "坠落危险标志", "Dấu hiệu nguy cơ ngã cao", "Balandlikdan yiqilish belgilari"], "낙하": ["낙하·비래 표지", "Falling-object indicators", "落物·飞来物标志", "Dấu hiệu vật rơi", "Tushayotgan jism belgilari"], "장비": ["건설기계·차량 표지", "Construction machinery and vehicle indicators", "建设机械·车辆标志", "Dấu hiệu máy xây dựng và xe", "Qurilish mashinalari va transport belgilari"], "붕괴": ["붕괴·무너짐 표지", "Collapse indicators", "坍塌·倒塌标志", "Dấu hiệu sập đổ", "Qulash belgilari"]}, "grpOrder": ["전기", "보호구", "환경", "가공전선", "고소", "관리", "밀폐", "굴착", "화기"], "grpOrderGen": ["추락", "낙하", "장비", "붕괴", "화기", "밀폐", "보호구", "환경"], "dom": {"elec": ["전기설비부문 표지 (U01–U19)", "Electrical indicators (U01–U19)", "电气设备部门标志 (U01–U19)", "Dấu hiệu thiết bị điện (U01–U19)", "Elektr uskunalari belgilari (U01–U19)"], "gen": ["일반작업 표지 (G01–G20)", "General work indicators (G01–G20)", "一般作业标志 (G01–G20)", "Dấu hiệu công việc chung (G01–G20)", "Umumiy ish belgilari (G01–G20)"]}, "sample": {"hits": [["U01", 46, 26], ["U16", 71, 62], ["U14", 28, 44], ["U05", 50, 57], ["U06", 26, 85]], "name": ["옥외 변압기 주변 물청소 중 감전", "Electric shock while hosing down an outdoor transformer", "室外变压器周边冲洗作业中触电", "Điện giật khi xịt rửa quanh máy biến áp ngoài trời", "Ochiq havodagi transformator atrofini yuvishda tok urishi"], "desc": ["전주에 설치된 개방형 변압기의 고압 부싱이 노출된 상태에서, 정전 확인 없이 물청소와 볼트 조임을 함께 수행하고 있다. 작업자는 절연장갑·절연모를 착용하지 않았고 바닥은 물로 젖어 있으며, 감시인 없이 혼자 작업하고 있다. 습윤으로 인체저항이 낮아진 상태에서 충전부에 접근하여 감전 위험이 중첩된다.", "The high-voltage bushings of an open pole-mounted transformer are exposed, yet washing and bolt tightening are carried out without confirming de-energisation. The worker wears no insulating gloves or helmet, the floor is wet, and no watcher is present. Body resistance is lowered by the water, so the hazards compound.", "杆上开放式变压器的高压套管处于裸露状态，未确认停电即进行冲洗与螺栓紧固。作业者未佩戴绝缘手套与绝缘帽，地面积水，且无监护人单独作业。潮湿使人体电阻降低，接近带电部位时触电风险叠加。", "Sứ cao áp của máy biến áp kiểu hở trên cột đang để trần, nhưng việc xịt rửa và siết bu lông vẫn tiến hành mà chưa xác nhận cắt điện. Người lao động không đeo găng và mũ cách điện, nền ướt, làm việc một mình không có người giám sát. Nước làm giảm điện trở cơ thể nên các mối nguy chồng lên nhau.", "Ustundagi ochiq transformatorning yuqori kuchlanishli izolyatorlari ochiq, ammo kuchlanish uzilishi tasdiqlanmasdan yuvish va bolt tortish bajarilmoqda. Ishchi izolyatsion qo'lqop va qalpoq kiymagan, pol ho'l, kuzatuvchi yo'q. Namlik tana qarshiligini pasaytirgani uchun xavflar qo'shilib ketadi."], "work": ["옥외 주상 변압기 주변 물청소 및 단자 볼트 조임 작업 (활선 상태·젖은 바닥)", "Hosing down and bolt tightening around an outdoor pole-mounted transformer (live, wet floor)", "室外杆上变压器周边冲洗及端子螺栓紧固作业（带电状态·地面潮湿）", "Xịt rửa và siết bu lông đầu cực quanh máy biến áp trên cột ngoài trời (đang mang điện, nền ướt)", "Ochiq havodagi ustun transformatori atrofini yuvish va terminal boltlarini tortish (kuchlanish ostida, ho'l pol)"]}, "corr": [{"id": "sum", "grp": null, "lab": ["6~8월 작업", "Work in June–August", "6~8月作业", "Làm việc tháng 6–8", "6–8 oylardagi ish"], "why": ["감전 사상자의 34.2 %가 6~8월에 집중", "34.2 % of shock casualties occur in June–August", "触电伤亡者的34.2%集中在6~8月", "34,2 % nạn nhân điện giật tập trung vào tháng 6–8", "Tok urishi qurbonlarining 34,2 % iyun–avgustga to'g'ri keladi"]}, {"id": "rain", "grp": ["전기", "보호구", "환경"], "lab": ["강우 중·직후", "During or right after rain", "降雨中·雨后", "Trong hoặc ngay sau mưa", "Yomg'ir paytida yoki keyin"], "why": ["습윤이 인체저항을 낮춰 저압에서도 치명적", "Wetness lowers body resistance; even low voltage becomes lethal", "潮湿降低人体电阻，低压也可致命", "Ẩm ướt làm giảm điện trở cơ thể, điện áp thấp cũng gây chết người", "Namlik tana qarshiligini pasaytiradi, past kuchlanish ham halokatli"]}, {"id": "morn", "grp": null, "lab": ["08~10시 작업 개시", "Work starting 08:00–10:00", "08~10时开始作业", "Bắt đầu làm việc 08–10 giờ", "Ish 08:00–10:00 da boshlanadi"], "why": ["시간대별 감전 사상자 최다 89명", "Highest hourly count of shock casualties: 89", "按时段触电伤亡者最多89人", "Số nạn nhân điện giật theo giờ cao nhất: 89 người", "Soatlik eng ko'p tok urishi qurbonlari: 89 kishi"]}, {"id": "fore", "grp": ["관리"], "lab": ["외국인 근로자 포함", "Foreign workers involved", "包含外籍劳工", "Có lao động nước ngoài", "Chet ellik ishchilar bor"], "why": ["전기 부문 외국인 42건의 감전 비율이 전체 평균의 2배", "Electric shock share among 42 foreign-worker cases is twice the average", "电气部门外籍劳工42起中触电比例为整体平均的2倍", "Tỷ lệ điện giật trong 42 vụ lao động nước ngoài gấp đôi mức trung bình", "42 chet ellik ishchi holatida tok urishi ulushi o'rtachadan ikki baravar"]}], "keys": {"U01": ["충전부", "분전반", "배전반", "제어반", "개폐기", "변압기", "부싱", "단자", "활선", "수전", "큐비클", "panel", "busbar", "transformer", "live"], "U02": ["이동전선", "케이블", "코드", "배선", "바닥배선", "cable", "cord"], "U03": ["플러그", "콘센트", "접속부", "plug", "socket", "outlet"], "U04": ["누전" <script>
(function(){
"use strict";
var LI = {ko:0, en:1, zh:2, vi:3, uz:4};
var lang = "ko";                 // 선택된 외국어 ("ko"면 병기 없음)
var sel  = {};                   // 선택된 표지 id -> true
var corr = {};                   // 보정 조건 id -> true
var mk   = {};                   // 표지 id -> [x%, y%]
var over = {};                   // 사용자가 직접 바꾼 빈도/강도  id -> {p,s}
var photoOn = false;
var lastFile = "";
var engMode = "ai";              // "ai" AI 사진 판독 · "auto" 키워드 판독 · "man" 직접 선택
var lastData = "";               // 현재 사진 data URL
var domain = "elec";             // "elec" 전기설비(C-C-49 PTW) · "gen" 일반작업(P-94 일반위험작업 허가서)
var domAuto = true;              // 판독 결과로 자동 결정 여부
var apiKey = "";                 // 사용자가 ⑦에 저장한 Claude API 키 (localStorage)
var serverKey = null;            // 서버(Vercel) 환경변수 키 설정 여부 (GET /api/read)
try{ apiKey = localStorage.getItem("esafety_key") || ""; }catch(e){}
var busy = false;
var touched = {};                // 사용자가 직접 켜고 끈 표지

function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

/* 다국어 병기 — 한국어 기준, 선택 언어를 아래 줄에 */
var TAGOK = /&lt;(\/?)(br|b)\s*\/?&gt;/g;
function keepTags(t){ return t.replace(TAGOK, "<$1$2>"); }
function T(a, cls){
  if(!a) return "";
  var ko = keepTags(esc(a[0]||""));
  var fo = (lang!=="ko" && a[LI[lang]] && a[LI[lang]]!==a[0])
           ? keepTags(esc(a[LI[lang]])) : "";
  return '<span class="t'+(cls?" "+cls:"")+'"><span class="k">'+ko+'</span>'+
         '<span class="f">'+fo+'</span></span>';
}
function U(key){ return T(UI[key]); }
function u1(key){ var a=UI[key]; return a? (a[0]||"") : ""; }

/* 위험성 등급 */
function lvl(v){ return v<=2?1:(v<=4?2:3); }
function lvKey(v){ return "lv"+lvl(v); }
function mgKey(v){ return "mg"+lvl(v); }
function rbCls(v){ return v>=9?"r4":(v>=6?"r3":(v>=3?"r2":"r1")); }
function badge(v){
  return '<span class="rb '+rbCls(v)+'">'+v+
         '<span class="lv">'+esc(u1(lvKey(v)))+'</span></span>';
}

/* 보정 적용 후 빈도 */
function corrFor(ind){
  var add=0, names=[];
  DATA.corr.forEach(function(c){
    if(!corr[c.id]) return;
    if(c.grp && c.grp.indexOf(ind.grp[0])<0) return;
    add++; names.push(c.lab[0]);
  });
  return {add:add, names:names};
}
function freq(ind){
  if(!ind.ra) return null;
  if(over[ind.id]) return over[ind.id].p;
  var c = corrFor(ind);
  return Math.min(3, ind.ra.p + (c.add?1:0));
}
function sev(ind){
  if(!ind.ra) return null;
  return over[ind.id] ? over[ind.id].s : ind.ra.s;
}

function picked(){ return DATA.ind.filter(function(x){return sel[x.id];}); }
function pickedRA(){ return picked().filter(function(x){return x.ra;}); }

/* ══════════════════════════ 체크리스트 */
function buildKb(){
  var h="";
  [["elec", DATA.grpOrder], ["gen", DATA.grpOrderGen]].forEach(function(dd){
    var dom=dd[0], order=dd[1], byGrp={};
    DATA.ind.filter(function(x){return x.dom===dom;}).forEach(function(x){
      (byGrp[x.grp[0]]=byGrp[x.grp[0]]||[]).push(x); });
    h+='<div class="dsec '+dom+'">'+T(DATA.dom[dom])+'</div>';
    order.forEach(function(g){
      var arr=byGrp[g]; if(!arr||!arr.length) return;
      h+='<div class="grp"><h4>'+T(DATA.grp[g]||[g,g,g,g,g])+'</h4><div class="items">';
      arr.forEach(function(x){
        var au = (readInfo && readInfo.ids.indexOf(x.id)>=0 && !touched[x.id])
                 ? '<span class="bd au'+(readInfo.ai?' ai':'')+'">'+esc(u1(readInfo.ai?"badgeAi":"badgeAuto"))+'</span>' : "";
        var bd = au
               + (x.ra?'<span class="bd ra">'+u1("tabB").slice(2).trim()+'</span>':"")
               + (x.ptw?'<span class="bd pt">PTW</span>':"")
               + (x.p94 && (x.p94.safe||[]).length?'<span class="bd p94">P-94</span>':"");
        h+='<label class="it" data-id="'+x.id+'">'+

function rndPos(){
  return [20+Math.round(Math.random()*60), 20+Math.round(Math.random()*60)];
}
/* 자동 판독 시 표지가 겹치지 않도록 느슨한 격자에 배치한다 */
function gridPos(i, n){
  var cols = n<=4 ? 2 : (n<=9 ? 3 : 4);
  var rows = Math.ceil(n/cols);
  var c = i % cols, r = Math.floor(i/cols);
  return [Math.round(100*(c+1)/(cols+1)), Math.round(100*(r+1)/(rows+1))];
}

var readInfo = null;          // {kw:[{id,words}], base:bool, file:""}
function norm(t){ return String(t||"").toLowerCase().replace(/[_\-.,()\[\]]+/g," "); }

function autoRead(fileName){
  var hay = norm([fileName, META.kind, META.place, META.no].join(" "));
  var hits = [], ids = [];
  Object.keys(DATA.keys).forEach(function(id){
    var found = DATA.keys[id].filter(function(w){
      return hay.indexOf(String(w).toLowerCase()) >= 0; });
    if(found.length){ hits.push({id:id, words:found}); ids.push(id); }
  });
  var base = false, dom = null;
  if(ids.length){
    var ng = ids.filter(function(i){return i.charAt(0)==="G";}).length;
    dom = ng > ids.length - ng ? "gen" : "elec";
  }
  if(!ids.length){ ids = (domain==="gen" ? DATA.baseGen : DATA.base).slice(); base = true; }
  ids.sort(function(a,b){
    return DATA.ind.findIndex(function(x){return x.id===a;}) -
           DATA.ind.findIndex(function(x){return x.id===b;}); });
  return {ids:ids, kw:hits, base:base, file:fileName||"", domain:dom};
}
function setDomain(d, auto){
  if(d!=="elec" && d!=="gen") return;
  domain = d; if(auto===false) domAuto=false;
  $$("#domSeg button").forEach(function(b){ b.classList.toggle("on", b.dataset.d===d); });
  var hint=$("#domHint");
  if(hint) hint.innerHTML = U(d==="gen"?"domHintGen":"domHintElec") +
    (domAuto && readInfo && readInfo.domain ? ' <i style="color:#0D6B1A">('+esc(u1("domAuto"))+')</i>' : '');
}

/* ══════════════════════════ AI 사진 판독 (/api/read) */
function shrink(dataUrl, max, cb){
  var img=new Image();
  img.onload=function(){
    var w=img.naturalWidth, h=img.naturalHeight, r=Math.min(1, max/Math.max(w,h));
    if(r>=1 && dataUrl.length < 3.5e6){ cb(dataUrl); return; }
    var c=document.createElement("canvas"); c.width=Math.round(w*r); c.height=Math.round(h*r);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    cb(c.toDataURL("image/jpeg", 0.86));
  };
  img.onerror=function(){ cb(dataUrl); };
  img.src=dataUrl;
}
function setBusy(on){
  busy=on;
  var g=$("#btnGo"); if(g) g.disabled=on;
  var box=$("#rdBox");
  if(on && box) box.innerHTML='<div class="rdsum busy"><span class="spin"></span>'+U("rdBusy")+'</div>';
}
function aiRead(dataUrl, fileName){
  if(busy) return;
  setBusy(true);
  shrink(dataUrl, 1600, function(small){
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 40000) : null;
    fetch("/api/read", {method:"POST", headers:{"content-type":"application/json"},
      signal: ctrl ? ctrl.signal : undefined,
      body: JSON.stringify({image:small, name:fileName||"", lang:lang, key:apiKey||undefined,
                            site:{kind:META.kind, place:META.place, no:META.no}})})
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(timer) clearTimeout(timer);
      setBusy(false);
      if(!j || !j.ok){ fallback(fileName, j && j.reason); return; }
      var hits={}, ids=[];
      (j.hits||[]).forEach(function(h){ if(!hits[h.id]){ hits[h.id]=h; ids.push(h.id); } });
      var base=false;
      var dom = (j.domain==="gen"||j.domain==="elec") ? j.domain : null;
      if(!dom && ids.length){
        var ng = ids.filter(function(i){return i.charAt(0)==="G";}).length;
        dom = ng > ids.length - ng ? "gen" : "elec";
      }
      if(!ids.length){ ids=((dom||domain)==="gen" ? DATA.baseGen : DATA.base).slice(); base=true; }
      ids.sort(function(a,b){
        return DATA.ind.findIndex(function(x){return x.id===a;}) -
               DATA.ind.findIndex(function(x){return x.id===b;}); });
      applyRead({ids:ids, kw:[], base:base, file:fileName||"", ai:true, hits:hits,
                 scene:j.scene||[], extra:j.extra||[], model:j.model||"", domain:dom});
    })
    .catch(function(e){ if(timer) clearTimeout(timer); setBusy(false);
                        fallback(fileName, e && e.name==="AbortError" ? "timeout" : "network"); });
  });
}
function fallback(fileName, reason){
  var info = autoRead(fileName);
  info.fallback = reason || "error";
  applyRead(info);
}
function keyStat(msg, cls){

function applyRead(info){
  readInfo = info;
  if(domAuto && info.domain) setDomain(info.domain);
  sel={}; over={}; manual=false; sampleMode=false; mk={}; touched={};
  info.ids.forEach(function(id, i){

    mk[id] = (h && isFinite(h.x) && isFinite(h.y)) ? [h.x, h.y] : gridPos(i, info.ids.length);
  });
  buildKb(); render();
}

function neededPermits(){
  if(domain==="gen") return neededP94();
  var hot=false, supp=[], safe={}, chk={};
  picked().forEach(function(x){
    if(!x.ptw) return;
    if(x.ptw.main==="h") hot=true;
    (x.ptw.supp||[]).forEach(function(s){ if(supp.indexOf(s)<0) supp.push(s); });
    (x.ptw.safe||[]).forEach(function(n){ safe[n]=true; });
    Object.keys(x.ptw.chk||{}).forEach(function(k){ chk[k]=x.ptw.chk[k]; });
  });
  supp.sort(function(a,b){
    return DATA.ptw.suppOrder.indexOf(a)-DATA.ptw.suppOrder.indexOf(b); });
  var L=DATA.ptw.L;
  return {hot:hot, supp:supp, safe:safe, chk:chk, mode:"cc49",
          mainLabel: hot ? L.hot[0] : L.gen[0]};
}
function neededP94(){
  var hot=false, supp=[], safe={}, items={};
  picked().forEach(function(x){
    var m=x.p94; if(!m) return;
    if(m.main==="hot") hot=true;
    (m.supp||[]).forEach(function(s){ if(supp.indexOf(s)<0) supp.push(s); });
    (m.safe||[]).forEach(function(n){ safe[n]=true; });
    ["go","jung"].forEach(function(k){
      (m[k+"Items"]||[]).forEach(function(i){ items[k+i]=true; });
    });
  });
  supp.sort(function(a,b){ return DATA.p94.suppOrder.indexOf(a)-DATA.p94.suppOrder.indexOf(b); });
  if(hot){ [1,2,5,11,12,13,14].forEach(function(n){ safe[n]=true; }); }
  var P=DATA.p94;
  return {hot:hot, supp:supp, safe:safe, items:items, mode:"p94",
          mainLabel: (hot ? P.titleHot[0] : P.title[0]).replace(/\s+/g," ")};
}

  var pl=$("#ptwPlace"); if(pl && !pl.dataset.touched) pl.value=META.place;
}

/* ══════════════════════════ 출력 문서 범위 */
var outMode="all";
function applyOut(){
  var b=$("#sh_paneB"), c=$("#sh_paneC");
  if(b) b.classList.toggle("hide", outMode==="ptw");
  if(c) c.classList.toggle("hide", outMode==="ra");
  numberSheets();
}
function numberSheets(){
  var vis=$$(".sheet").filter(function(s){return !s.classList.contains("hide");});
  vis.forEach(function(s,i){
    var e=$(".ft .sn",s);
    if(e) e.textContent = u1("sheetno")+" "+(i+1)+" / "+vis.length;
  });
}

/* ══════════════════════════ 렌더 */
function render(){
  renderVerdict(); renderCards(); renderRA(); renderPTW();
  drawMk(); applyMeta(); applyOut(); renderEngine();
  var c=$("#cnt"); if(c) c.textContent = u1("count")+" "+picked().length+" / "+DATA.ind.length;
}

/* ══════════════════════════ 언어 */
function setLang(l){
  lang=l;
  if(typeof renderKey==="function" && $("#keyStat")) setTimeout(renderKey,0);
  if($("#domSeg")) setTimeout(function(){ setDomain(domain); },0);
  var sl=$("#langSel"); if(sl && sl.value!==l) sl.value=l;
  $$("[data-ui]").forEach(function(el){ el.innerHTML = U(el.dataset.ui); });
  $$("[data-ui-k]").forEach(function(el){ el.textContent = u1(el.dataset.uiK); });
  $$("[data-ui-h]").forEach(function(el){
    var a=UI[el.dataset.uiH];
    var ko=keepTags(esc(a[0]));
    var fo=(l!=="ko" && a[LI[l]] && a[LI[l]]!==a[0]) ? keepTags(esc(a[LI[l]])) : "";
    el.innerHTML = ko + (fo? '<span style="display:block;color:#B00;margin-top:3px">'+fo+'</span>' : "");
  });
  $$("[data-ui-f]").forEach(function(el){
    var a=UI[el.dataset.uiF];
    el.textContent = (l!=="ko" && a && a[LI[l]] && a[LI[l]]!==a[0]) ? a[LI[l]] : "";
  });
  if(sl && sl.options[0]) sl.options[0].textContent = u1("m_none");
  document.documentElement.lang = (l==="ko"?"ko":l);
  buildKb(); render();
}

/* ══════════════════════════ 사진 */
function fitBox(){
  var box=$("#photoBox"), img=$("#photoImg");
  if(!box||!img) return;
  function ap(){
    if(!img.naturalWidth) return;
    box.style.aspectRatio = img.naturalWidth+" / "+img.naturalHeight;
  }
  if(img.complete) ap(); else img.addEventListener("load", ap, {once:true});
}
function initPhoto(){
  var box=$("#photoBox"), drop=$("#drop"), inp=$("#file"), img=$("#photoImg");
  function load(f){
    if(!f || !/^image\//.test(f.type)) return;
    var r=new FileReader();
    r.onload=function(e){
      img.src=e.target.result; box.classList.add("on"); photoOn=true; fitBox();
      setThumb(e.target.result); lastFile = f.name; lastData = e.target.result;
      if(engMode==="ai"){ sel={}; over={}; mk={}; touched={}; readInfo=null; sampleMode=false; manual=false;
        buildKb(); render(); aiRead(lastData, f.name); }
      else if(engMode==="auto"){ applyRead(autoRead(f.name)); }
      else {
        sampleMode=false; manual=false;
        picked().forEach(function(x,i){ if(!mk[x.id]) mk[x.id]=gridPos(i, picked().length); });
        buildKb(); render();
      }
    };
    r.readAsDataURL(f);
  }
  [drop, box].forEach(function(d){ if(!d) return;
    d.addEventListener("click", function(e){ if(e.target.closest(".mk")) return; inp.click(); }); });
  inp.addEventListener("change", function(){ load(this.files[0]); });
  [drop, box].forEach(function(d){ if(!d) return;
    ["dragenter","dragover"].forEach(function(ev){
      d.addEventListener(ev,function(e){e.preventDefault(); d.classList.add("dz");});});
    ["dragleave","drop"].forEach(function(ev){
      d.addEventListener(ev,function(e){e.preventDefault(); d.classList.remove("dz");});});
    d.addEventListener("drop", function(e){ load(e.dataTransfer.files[0]); });});
}

function setThumb(src){
  var t=$("#thumb"), ti=$("#thumbImg");
  if(!t||!ti) return;
  if(src){ ti.src=src; t.classList.add("on"); }
  else { ti.removeAttribute("src"); t.classList.remove("on"); }
}
function loadSample(){
  sampleMode=true; manual=false; readInfo=null; touched={}; lastFile="";
  sel={}; over={}; mk={}; domAuto=true; setDomain("elec");
  DATA.sample.hits.forEach(function(hh){ sel[hh[0]]=true; mk[hh[0]]=[hh[1],hh[2]]; });
  var img=$("#photoImg");
  if(SAMPLE_IMG){ img.src=SAMPLE_IMG; $("#photoBox").classList.add("on"); photoOn=true;
    fitBox(); setThumb(SAMPLE_IMG); lastData=SAMPLE_IMG; lastFile="sample.jpg"; }
  buildKb(); render();
}
function resetAll(){
  sel={}; over={}; corr={}; mk={}; manual=false; sampleMode=false; photoOn=false;
  readInfo=null; touched={}; lastFile=""; lastData=""; domAuto=true; setDomain("elec");
  $("#photoBox").classList.remove("on"); $("#photoBox").style.aspectRatio="";
  $("#photoImg").removeAttribute("src"); $("#file").value=""; setThumb(null);
  buildKb(); render();
}

/* ══════════════════════════ 초기화 */
document.addEventListener("DOMContentLoaded", function(){
  var sl=$("#langSel");
  if(sl) sl.addEventListener("change", function(){ setLang(this.value); });
  $$("#engSeg button").forEach(function(b){
    b.addEventListener("click", function(){
      $$("#engSeg button").forEach(function(x){x.classList.remove("on");});
      this.classList.add("on"); engMode=this.dataset.e;
      if(photoOn && !sampleMode && engMode!=="man"){ runRead(); }
      else { renderEngine(); }
    });
  });
  $$("#outSeg button").forEach(function(b){
    b.addEventListener("click", function(){
      $$("#outSeg button").forEach(function(x){x.classList.remove("on");});
      this.classList.add("on"); outMode=this.dataset.o; applyOut();
    });
  });
  $("#btnPrint").addEventListener("click", function(){ window.print(); });
  $("#btnReset").addEventListener("click", resetAll);
  $("#btnSample").addEventListener("click", loadSample);
  $("#btnGo").addEventListener("click", function(){
    if(photoOn && engMode!=="man") runRead();
    else render();
    var t=$("#sh_paneA"); if(t) t.scrollIntoView({behavior:"smooth", block:"start"});
  });
  $("#selAll").addEventListener("click", function(){
    DATA.ind.forEach(function(x,i){ sel[x.id]=true; touched[x.id]=true;
      if(!mk[x.id]) mk[x.id]=gridPos(i, DATA.ind.length); });
    buildKb(); render(); });
  $("#selNone").addEventListener("click", function(){
    sel={}; DATA.ind.forEach(function(x){ touched[x.id]=true; });
    buildKb(); render(); });
  $$("#domSeg button").forEach(function(b){
    b.addEventListener("click", function(){ setDomain(this.dataset.d, false); render(); });
  });
  initPhoto();
  bindMeta();
  initKey();
  setLang("zh");          /* 병기 기본값 — 중국어 */
  loadSample();
});
})();
</script>
</body></html>
