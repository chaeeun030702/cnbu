1", 46, 26], ["U16", 71, 62], ["U14", 28, 44], ["U05", 50, 57], ["U06", 26, 85]], "name": ["옥외 변압기 주변 물청소 중 감전", "Electric shock while hosing down an outdoor transformer", "室外变压器周边冲洗作业中触电", "Điện giật khi xịt rửa quanh máy biến áp ngoài trời", "Ochiq havodagi transformator atrofini yuvishda tok urishi"], "desc": ["전주에 설치된 개방형 변압기의 고압 부싱이 노출된 상태에서, 정전 확인 없이 물청소와 볼트 조임을 함께 수행하고 있다. 작업자는 절연장갑·절연모를 착용하지 않았고 바닥은 물로 젖어 있으며, 감시인 없이 혼자 작업하고 있다. 습윤으로 인체저항이 낮아진 상태에서 충전부에 접근하여 감전 위험이 중첩된다.", "The high-voltage bushings of an open pole-mounted transformer are exposed, yet washing and bolt tightening are carried out without confirming de-energisation. The worker wears no insulating gloves or helmet, the floor is wet, and no watcher is present. Body resistance is lowered by the water, so the hazards compound.", "杆上开放式变压器的高压套管处于裸露状态，未确认停电即进行冲洗与螺栓紧固。作业者未佩戴绝缘手套与绝缘帽，地面积水，且无监护人单独作业。潮湿使人体电阻降低，接近带电部位时触电风险叠加。", "Sứ cao áp của máy biến áp kiểu hở trên cột đang để trần, nhưng việc xịt rửa và siết bu lông vẫn tiến hành mà chưa xác nhận cắt điện. Người lao động không đeo găng và mũ cách điện, nền ướt, làm việc một mình không có người giám sát. Nước làm giảm điện trở cơ thể nên các mối nguy chồng lên nhau.", "Ustundagi ochiq transformatorning yuqori kuchlanishli izolyatorlari ochiq, ammo kuchlanish uzilishi tasdiqlanmasdan yuvish va bolt tortish bajarilmoqda. Ishchi izolyatsion qo'lqop va qalpoq kiymagan, pol ho'l, kuzatuvchi yo'q. Namlik tana qarshiligini pasaytirgani uchun xavflar qo'shilib ketadi."], "work": ["옥외 주상 변압기 주변 물청소 및 단자 볼트 조임 작업 (활선 상태·젖은 바닥)", "Hosing down and bolt tightening around an outdoor pole-mounted transformer (live, wet floor)", "室外杆上变压器周边冲洗及端子螺栓紧固作业（带电状态·地面潮湿）", "Xịt rửa và siết bu lông đầu cực quanh máy biến áp trên cột ngoài trời (đang mang điện, nền ướt)", "Ochiq havodagi ustun transformatori atrofini yuvish va terminal boltlarini tortish (kuchlanish ostida, ho'l pol)"]}, "corr": [{"id": "sum", "grp": null, "lab": ["6~8월 작업", "Work in June–August", "6~8月作业", "Làm v <script>
(function(){
"use strict";
var LI = {ko:0, en:1, zh:2, vi:3, uz:4};
var lang = "ko";                 // 선택된 외국어 ("ko"면 병기 없음)
var sel  = {};                   // 선택된 표지 id -> true
var corr = {};                   // 보정 조건 id -> true
var mk   = {};                   // 표지 id -> [x%, y%]
var over = {};                   // 사용자가 직접 바꾼 빈도/강도  id -> {p,s}
var photoOn = false;
var lastFile = "";
var engMode = "ai";              // "ai" AI 사진 판독 · "auto" 키워드 판독 · "man" 직접 선택
var lastData = "";               // 현재 사진 data URL
var busy = false;
var touched = {};                // 사용자가 직접 켜고 끈 표지

function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

/* 다국어 병기 — 한국어 기준, 선택 언어를 아래 줄에 */
var TAGOK = /&lt;(\/?)(br|b)\s*\/?&gt;/g;
function keepTags(t){ return t.replace(TAGOK, "<$1$2>"); }
function T(a, cls){
  if(!a) return "";
  var ko = keepTags(esc(a[0]||""));
  var fo = (lang!=="ko" && a[LI[lang]] && a[LI[lang]]!==a[0])
           ? keepTags(esc(a[LI[lang]])) : "";
  return '<span class="t'+(cls?" "+cls:"")+'"><span class="k">'+ko+'</span>'+
         '<span class="f">'+fo+'</span></span>';
}
function U(key){ return T(UI[key]); }
function u1(key){ var a=UI[key]; return a? (a[0]||"") : ""; }

/* 위험성 등급 */
function lvl(v){ return v<=2?1:(v<=4?2:3); }
function lvKey(v){ return "lv"+lvl(v); }
function mgKey(v){ return "mg"+lvl(v); }
function rbCls(v){ return v>=9?"r4":(v>=6?"r3":(v>=3?"r2":"r1")); }
function badge(v){
  return '<span class="rb '+rbCls(v)+'">'+v+
         '<span class="lv">'+esc(u1(lvKey(v)))+'</span></span>';
}

/* 보정 적용 후 빈도 */
function corrFor(ind){
  var add=0, names=[];
  DATA.corr.forEach(function(c){
    if(!corr[c.id]) return;
    if(c.grp && c.grp.indexOf(ind.grp[0])<0) return;
    add++; names.push(c.lab[0]);
  });
  return {add:add, names:names};
}
function freq(ind){
  if(!ind.ra) return null;
  if(over[ind.id]) return over[ind.id].p;
  var c = corrFor(ind);
  return Math.min(3, ind.ra.p + (c.add?1:0));
}
function sev(ind){
  if(!ind.ra) return null;
  return over[ind.id] ? over[ind.id].s : ind.ra.s;
}

function picked(){ return DATA.ind.filter(function(x){return sel[x.id];}); }
function pickedRA(){ return picked().filter(function(x){return x.ra;}); }

/* ══════════════════════════ 체크리스트 */
function buildKb(){
  var byGrp={};
  DATA.ind.forEach(function(x){ (byGrp[x.grp[0]]=byGrp[x.grp[0]]||[]).push(x); });
  var h="";
  DATA.grpOrder.forEach(function(g){
    var arr=byGrp[g]; if(!arr||!arr.length) return;
    h+='<div class="grp"><h4>'+T(DATA.grp[g]||[g,g,g,g,g])+'</h4><div class="items">';
    arr.forEach(function(x){
      var au = (readInfo && readInfo.ids.indexOf(x.id)>=0 && !touched[x.id])
               ? '<span class="bd au'+(readInfo.ai?' ai':'')+'">'+esc(u1(readInfo.ai?"badgeAi":"badgeAuto"))+'</span>' : "";
      var bd = au
             + (x.ra?'<span class="bd ra">'+u1("tabB").slice(2).trim()+'</span>':"")
             + (x.ptw?'<span class="bd pt">PTW</span>':"");
      h+='<label class="it" data-id="'+x.id+'">'+
         '<input type="checkbox" class="kbx" value="'+x.id+'">'+
         '<span class="lb"><span class="cd">'+x.id+bd+'</span>'+T(x.tag)+'</span></label>';
    });
    h+='</div></div>';
  });
  $("#kbList").innerHTML=h;

  var c='<div class="grp"><h4>'+U("st2c")+'</h4><div class="corr">';
  DATA.corr.forEach(function(x){
    c+='<label class="it" data-cid="'+x.id+'">'+
       '<input type="checkbox" class="cbx2" value="'+x.id+'">'+
       '<span class="lb">'+T(x.lab)+'<span class="why">'+T(x.why)+'</span></span></label>';
  });
  $("#corrList").innerHTML=c+'</div></div>';

  $$(".kbx").forEach(function(el){
    el.checked = !!sel[el.value];
    el.closest(".it").classList.toggle("on", el.checked);
    el.addEventListener("change", function(){
      touched[this.value]=true;
      if(this.checked){ sel[this.value]=true; if(!mk[this.value]) mk[this.value]=rndPos(); }
      else { delete sel[this.value]; }
      this.closest(".it").classList.toggle("on", this.checked);
      buildKb(); render();
    });
  });
  $$(".cbx2").forEach(function(el){
    el.checked = !!corr[el.value];
    el.closest(".it").classList.toggle("on", el.checked);
    el.addEventListener("change", function(){
      if(this.checked) corr[this.value]=true; else delete corr[this.value];

function rndPos(){
  return [20+Math.round(Math.random()*60), 20+Math.round(Math.random()*60)];
}
/* 자동 판독 시 표지가 겹치지 않도록 느슨한 격자에 배치한다 */
function gridPos(i, n){
  var cols = n<=4 ? 2 : (n<=9 ? 3 : 4);
  var rows = Math.ceil(n/cols);
  var c = i % cols, r = Math.floor(i/cols);
  return [Math.round(100*(c+1)/(cols+1)), Math.round(100*(r+1)/(rows+1))];
}

        mk[x.id]=[Math.round(nx),Math.round(ny)];
        d.style.left=nx+"%"; d.style.top=ny+"%";
      }
      function up(){window.removeEventListener("pointermove",mv);

    });

/* ══════════════════════════ 업로드 자동 판독 (키워드 1차 매칭) */
var readInfo = null;          // {kw:[{id,words}], base:bool, file:""}
function norm(t){ return String(t||"").toLowerCase().replace(/[_\-.,()\[\]]+/g," "); }

function autoRead(fileName){
  var hay = norm([fileName, META.kind, META.place, META.no].join(" "));
  var hits = [], ids = [];
  Object.keys(DATA.keys).forEach(function(id){
    var found = DATA.keys[id].filter(function(w){
      return hay.indexOf(String(w).toLowerCase()) >= 0; });
    if(found.length){ hits.push({id:id, words:found}); ids.push(id); }
  });
  var base = false;
  if(!ids.length){ ids = DATA.base.slice(); base = true; }
  ids.sort(function(a,b){
    return DATA.ind.findIndex(function(x){return x.id===a;}) -
           DATA.ind.findIndex(function(x){return x.id===b;}); });
  return {ids:ids, kw:hits, base:base, file:fileName||""};
}

/* ══════════════════════════ AI 사진 판독 (/api/read) */
function shrink(dataUrl, max, cb){
  var img=new Image();
  img.onload=function(){
    var w=img.naturalWidth, h=img.naturalHeight, r=Math.min(1, max/Math.max(w,h));
    if(r>=1 && dataUrl.length < 3.5e6){ cb(dataUrl); return; }
    var c=document.createElement("canvas"); c.width=Math.round(w*r); c.height=Math.round(h*r);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    cb(c.toDataURL("image/jpeg", 0.86));
  };
  img.onerror=function(){ cb(dataUrl); };
  img.src=dataUrl;
}
function setBusy(on){
  busy=on;
  var g=$("#btnGo"); if(g) g.disabled=on;
  var box=$("#rdBox");
  if(on && box) box.innerHTML='<div class="rdsum busy"><span class="spin"></span>'+U("rdBusy")+'</div>';
}
function aiRead(dataUrl, fileName){
  if(busy) return;
  setBusy(true);
  shrink(dataUrl, 1600, function(small){
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 40000) : null;
    fetch("/api/read", {method:"POST", headers:{"content-type":"application/json"},
      signal: ctrl ? ctrl.signal : undefined,
      body: JSON.stringify({image:small, name:fileName||"", lang:lang,
                            site:{kind:META.kind, place:META.place, no:META.no}})})
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(timer) clearTimeout(timer);
      setBusy(false);
      if(!j || !j.ok){ fallback(fileName, j && j.reason); return; }
      var hits={}, ids=[];
      (j.hits||[]).forEach(function(h){ if(!hits[h.id]){ hits[h.id]=h; ids.push(h.id); } });
      var base=false;
      if(!ids.length){ ids=DATA.base.slice(); base=true; }
      ids.sort(function(a,b){
        return DATA.ind.findIndex(function(x){return x.id===a;}) -
               DATA.ind.findIndex(function(x){return x.id===b;}); });
      applyRead({ids:ids, kw:[], base:base, file:fileName||"", ai:true, hits:hits,
                 scene:j.scene||[], extra:j.extra||[], model:j.model||""});
    })
    .catch(function(e){ if(timer) clearTimeout(timer); setBusy(false);
                        fallback(fileName, e && e.name==="AbortError" ? "timeout" : "network"); });
  });
}
function fallback(fileName, reason){
  var info = autoRead(fileName);
  info.fallback = reason || "error";
  applyRead(info);
}
function runRead(){
  if(!photoOn || !lastData){ render(); return; }
  if(engMode==="ai") aiRead(lastData, lastFile);
  else if(engMode==="auto") applyRead(autoRead(lastFile));
  else render();
}

/* 판독 결과를 선택 상태·마커로 반영하고 세 문서를 다시 작성한다 */
function applyRead(info){
  readInfo = info;
  sel={}; over={}; manual=false; sampleMode=false; mk={}; touched={};
  info.ids.forEach(function(id, i){
    sel[id]=true;
    var h = info.hits && info.hits[id];
    mk[id] = (h && isFinite(h.x) && isFinite(h.y)) ? [h.x, h.y] : gridPos(i, info.ids.length);
  });
  buildKb(); render();
}

/* 필요한 허가 산출 */
function neededPermits(){
  var hot=false, supp=[], safe={}, chk={};
  picked().forEach(function(x){
    if(!x.ptw) return;
    if(x.ptw.main==="h") hot=true;
    (x.ptw.supp||[]).forEach(function(s){ if(supp.indexOf(s)<0) supp.push(s); });
    (x.ptw.safe||[]).forEach(function(n){ safe[n]=true; });
    Object.keys(x.ptw.chk||{}).forEach(function(k){ chk[k]=x.ptw.chk[k]; });
  });
  supp.sort(function(a,b){
    return DATA.ptw.suppOrder.indexOf(a)-DATA.ptw.suppOrder.indexOf(b); });
  var L=DATA.ptw.L;
  return {hot:hot, supp:supp, safe:safe, chk:chk,
          mainLabel: hot ? L.hot[0] : L.gen[0]};
}

  var h='<select class="sel" data-k="'+kind+'" data-id="'+id+'">';

    h+='<option value="'+x[0]+'"'+(x[0]===val?" selected":"")+'>'+x[0]+' '+x[1]+'</option>';
  });
  return h+'</select>';
}

/* ══════════════════════════ ③ PTW */
function renderPTW(){
  var arr=picked();
  if(!arr.length){ $("#paneC").innerHTML='<div class="empty">'+U("ptwnone")+'</div>'; return; }
  var P=DATA.ptw, L=P.L, n=neededPermits();
  var h='<div class="ptw"><div class="ph"><div class="sub">'+T(P.sub)+'</div></div>';

  /* 머리 */
  h+='<table><tr><td class="k">'+T(L.no)+'</td><td><input type="text"></td>'+
     '<td class="k">'+T(L.date)+'</td><td><input type="text" placeholder="'+
     esc(L.ymd[0])+'"></td></tr>'+
     '<tr><td class="k">'+T(L.type)+'</td><td colspan="3" class="auto">'+
     '<div class="mline"><label><input type="radio" class="rdo" name="mt"'+
     (n.hot?"":" checked")+'>'+T(L.gen)+'</label><label>'+
     '<input type="radio" class="rdo" name="mt"'+(n.hot?" checked":"")+'>'+
     T(L.hot)+'</label></div></td></tr>'+
     '<tr><td class="k">'+T(L.appl)+'</td><td><input type="text"></td>'+
     '<td class="k">'+T(L.period)+'</td><td><input type="text"></td></tr>'+
     '<tr><td class="k">'+T(L.place)+'</td><td colspan="3" class="auto">'+
     '<input type="text" id="ptwPlace" placeholder="'+esc(L.placef[0])+'"></td></tr>'+
     '<tr><td class="k">'+T(L.scope)+'</td><td colspan="3" class="auto">'+
     '<input type="text" id="ptwScope"></td></tr>'+
     '<tr><td class="k">'+T(L.ranum)+'</td><td colspan="3"><input type="text"></td></tr></table>';

  /* Ⅰ 안전조치 */
  h+='<div class="sec"><div class="sh">'+T(L.s1)+'</div><table>';
  P.safe.forEach(function(x,i){
    var on = !!n.safe[i+1];
    h+='<tr'+(on?' class="auto"':'')+'><td class="c" style="width:30px">'+(i+1)+'</td>'+
       '<td><label><input type="checkbox" class="cbx"'+(on?" checked":"")+'>'+T(x)+
       '</label></td></tr>';
  });
  if(n.hot){
    P.hot.forEach(function(x,i){
      h+='<tr class="auto"><td class="c">H'+(i+1)+'</td><td><label>'+
         '<input type="checkbox" class="cbx" checked>'+T(x)+'</label></td></tr>';
    });
  }
  h+='</table></div>';

  /* Ⅱ 점검 */
  h+='<div class="sec"><div class="sh">'+T(L.s2)+'</div><table><tr><th style="width:30px">'+
     T(L.noh)+'</th><th>'+T(L.item)+'</th><th style="width:46px">'+T(L.yes)+'</th>'+
     '<th style="width:46px">'+T(L.no2)+'</th><th style="width:46px">N/A</th></tr>';
  P.chk.forEach(function(x,i){
    var v=n.chk[String(i+1)];
    h+='<tr'+(v?' class="auto"':'')+'><td class="c">'+(i+1)+'</td><td>'+T(x)+'</td>'+
       '<td class="c"><input type="radio" class="rdo" name="q'+i+'"'+
         (v==="Y"?" checked":"")+'></td>'+
       '<td class="c"><input type="radio" class="rdo" name="q'+i+'"'+
         (v==="N"?" checked":"")+'></td>'+
       '<td class="c"><input type="radio" class="rdo" name="q'+i+'"></td></tr>';
  });
  h+='</table></div>';

  /* Ⅲ 보충허가 */
  h+='<div class="sec"><div class="sh">'+T(L.s3)+'</div>';
  if(!n.supp.length){
    h+='<div class="note">'+U("nosel")+'</div>';
  }
  n.supp.forEach(function(k){
    h+='<div class="blk"><div class="bh">'+T(P.suppName[k])+
       '<span class="sub2">'+esc(P.suppSub[k][0])+'</span></div><div class="bi">';
    if(k==="jeon"){
      h+='<div style="margin-bottom:6px">'+T(P.step6Head)+'</div>';
      h+='<table><tr><th style="width:34px">'+T(L.noh)+'</th><th>'+T(L.item)+'</th>'+
         '<th style="width:96px">'+T(L.pos)+'</th><th style="width:70px">'+T(L.sign)+'</th></tr>';
      P.step6.forEach(function(r){
        h+='<tr><td class="c">'+esc(r[0][0])+'</td><td>'+T(r[1])+'</td>'+
           '<td class="c">'+T(r[2])+'</td><td class="c"><input type="text"></td></tr>';
      });
      h+='</table><div class="note">'+T(P.lock)+'</div>'+
         '<div class="note">'+T(P.restore)+'</div>';
    } else {
      (P.suppItems[k]||[]).forEach(function(x){
        h+='<div><label><input type="checkbox" class="cbx">'+T(x)+'</label></div>';
      });
    }
    h+='</div></div>';
  });
  h+='</div>';

  /* Ⅳ·Ⅴ */
  h+='<div class="sec"><div class="sh">'+T(L.s4)+'</div><table>'+
     '<tr><td class="k">'+T(L.done)+'</td><td><input type="text"></td>'+
     '<td class="k">'+T(L.confirm)+'</td><td><input type="text"></td></tr></table></div>';
  h+='<div class="sec"><div class="sh">'+T(L.s5)+'</div><table>'+
     '<tr><th>'+T(L.issuer)+'</th><th>'+T(L.checker)+'</th><th>'+T(L.approver)+'</th>'+
     '<th>'+T(L.attend)+'</th></tr><tr>'+
     '<td class="c"><input type="text"></td><td class="c"><input type="text"></td>'+
     '<td class="c"><input type="text"></td><td class="c"><input type="text"></td>'+
     '</tr></table>'+
     '<div class="note">'+T(L.s5n)+'</div></div>';

  h+='<div class="autonote">■ '+U("ptwauto")+'</div>';
  $("#paneC").innerHTML=h+'</div>';

  /* 작업 개요·장소 자동 입력 (사용자 수정 시 보존) */
  var sc=$("#ptwScope"), pl=$("#ptwPlace");
  if(sc){ sc.value = autoScope(); sc.addEventListener("input", function(){ manual=true; }); }
  if(pl){ pl.value = META.place || "";
    pl.addEventListener("input", function(){ this.dataset.touched="1"; }); }
}
var manual=false;
function autoScope(){
  if(manual && lastScope) return lastScope;
  var v = DATA.sample.work[LI[lang]] || DATA.sample.work[0];
  if(!sampleMode){
    var names = picked().map(function(x){return x.tag[LI[lang]]||x.tag[0];});
    v = names.length ? names.slice(0,3).join(" / ") : "";
  }
  lastScope=v; return v;
}
var lastScope="", sampleMode=true;

/* ══════════════════════════ 현장 정보 (좌측 패널 → 문서 반영) */
var META = {no:"", date:"", kind:"", place:"", by:"", ck:""};
function bindMeta(){
  [["mNo","no"],["mDate","date"],["mKind","kind"],
   ["mPlace","place"],["mBy","by"],["mCk","ck"]].forEach(function(x){
    var el=$("#"+x[0]); if(!el) return;
    el.value = META[x[1]];
    el.addEventListener("input", function(){ META[x[1]]=this.value; applyMeta(); });
  });
}
function applyMeta(){
  var m={raNo:META.no, raDate:META.date, raKind:META.kind, raPlace:META.place,
         raBy:META.by, raCk:META.ck};
  Object.keys(m).forEach(function(k){ var e=$("#"+k); if(e) e.value=m[k]; });
  var pl=$("#ptwPlace"); if(pl && !pl.dataset.touched) pl.value=META.place;
}

/* ══════════════════════════ 출력 문서 범위 */
var outMode="all";
function applyOut(){
  var b=$("#sh_paneB"), c=$("#sh_paneC");
  if(b) b.classList.toggle("hide", outMode==="ptw");
  if(c) c.classList.toggle("hide", outMode==="ra");
  numberSheets();
}
function numberSheets(){
  var vis=$$(".sheet").filter(function(s){return !s.classList.contains("hide");});
  vis.forEach(function(s,i){
    var e=$(".ft .sn",s);
    if(e) e.textContent = u1("sheetno")+" "+(i+1)+" / "+vis.length;
  });
}

/* ══════════════════════════ 렌더 */
function render(){
  renderVerdict(); renderCards(); renderRA(); renderPTW();
  drawMk(); applyMeta(); applyOut(); renderEngine();
  var c=$("#cnt"); if(c) c.textContent = u1("count")+" "+picked().length+" / "+DATA.ind.length;
}

/* ══════════════════════════ 언어 */
function setLang(l){
  lang=l;
  var sl=$("#langSel"); if(sl && sl.value!==l) sl.value=l;
  $$("[data-ui]").forEach(function(el){ el.innerHTML = U(el.dataset.ui); });
  $$("[data-ui-k]").forEach(function(el){ el.textContent = u1(el.dataset.uiK); });
  $$("[data-ui-h]").forEach(function(el){
    var a=UI[el.dataset.uiH];
    var ko=keepTags(esc(a[0]));
    var fo=(l!=="ko" && a[LI[l]] && a[LI[l]]!==a[0]) ? keepTags(esc(a[LI[l]])) : "";
    el.innerHTML = ko + (fo? '<span style="display:block;color:#B00;margin-top:3px">'+fo+'</span>' : "");
  });
  $$("[data-ui-f]").forEach(function(el){
    var a=UI[el.dataset.uiF];
    el.textContent = (l!=="ko" && a && a[LI[l]] && a[LI[l]]!==a[0]) ? a[LI[l]] : "";
  });
  if(sl && sl.options[0]) sl.options[0].textContent = u1("m_none");
  document.documentElement.lang = (l==="ko"?"ko":l);
  buildKb(); render();
}

/* ══════════════════════════ 사진 */
function fitBox(){
  var box=$("#photoBox"), img=$("#photoImg");
  if(!box||!img) return;
  function ap(){
    if(!img.naturalWidth) return;
    box.style.aspectRatio = img.naturalWidth+" / "+img.naturalHeight;
  }
  if(img.complete) ap(); else img.addEventListener("load", ap, {once:true});
}
function initPhoto(){
  var box=$("#photoBox"), drop=$("#drop"), inp=$("#file"), img=$("#photoImg");
  function load(f){
    if(!f || !/^image\//.test(f.type)) return;
    var r=new FileReader();
    r.onload=function(e){
      img.src=e.target.result; box.classList.add("on"); photoOn=true; fitBox();
      setThumb(e.target.result); lastFile = f.name; lastData = e.target.result;
      if(engMode==="ai"){ sel={}; over={}; mk={}; touched={}; readInfo=null; sampleMode=false; manual=false;
        buildKb(); render(); aiRead(lastData, f.name); }
      else if(engMode==="auto"){ applyRead(autoRead(f.name)); }
      else {
        sampleMode=false; manual=false;
        picked().forEach(function(x,i){ if(!mk[x.id]) mk[x.id]=gridPos(i, picked().length); });
        buildKb(); render();
      }
    };
    r.readAsDataURL(f);
  }
  [drop, box].forEach(function(d){ if(!d) return;
    d.addEventListener("click", function(e){ if(e.target.closest(".mk")) return; inp.click(); }); });
  inp.addEventListener("change", function(){ load(this.files[0]); });
  [drop, box].forEach(function(d){ if(!d) return;
    ["dragenter","dragover"].forEach(function(ev){
      d.addEventListener(ev,function(e){e.preventDefault(); d.classList.add("dz");});});
    ["dragleave","drop"].forEach(function(ev){
      d.addEventListener(ev,function(e){e.preventDefault(); d.classList.remove("dz");});});
    d.addEventListener("drop", function(e){ load(e.dataTransfer.files[0]); });});
}

function setThumb(src){
  var t=$("#thumb"), ti=$("#thumbImg");
  if(!t||!ti) return;
  if(src){ ti.src=src; t.classList.add("on"); }
  else { ti.removeAttribute("src"); t.classList.remove("on"); }
}
function loadSample(){
  sampleMode=true; manual=false; readInfo=null; touched={}; lastFile="";
  sel={}; over={}; mk={};
  DATA.sample.hits.forEach(function(hh){ sel[hh[0]]=true; mk[hh[0]]=[hh[1],hh[2]]; });
  var img=$("#photoImg");
  if(SAMPLE_IMG){ img.src=SAMPLE_IMG; $("#photoBox").classList.add("on"); photoOn=true;
    fitBox(); setThumb(SAMPLE_IMG); lastData=SAMPLE_IMG; lastFile="sample.jpg"; }
  buildKb(); render();
}
function resetAll(){
  sel={}; over={}; corr={}; mk={}; manual=false; sampleMode=false; photoOn=false;
  readInfo=null; touched={}; lastFile=""; lastData="";
  $("#photoBox").classList.remove("on"); $("#photoBox").style.aspectRatio="";
  $("#photoImg").removeAttribute("src"); $("#file").value=""; setThumb(null);
  buildKb(); render();
}

/* ══════════════════════════ 초기화 */
document.addEventListener("DOMContentLoaded", function(){
  var sl=$("#langSel");
  if(sl) sl.addEventListener("change", function(){ setLang(this.value); });
  $$("#engSeg button").forEach(function(b){
    b.addEventListener("click", function(){
      $$("#engSeg button").forEach(function(x){x.classList.remove("on");});
      this.classList.add("on"); engMode=this.dataset.e;
      if(photoOn && !sampleMode && engMode!=="man"){ runRead(); }
      else { renderEngine(); }
    });
  });
  $$("#outSeg button").forEach(function(b){
    b.addEventListener("click", function(){
      $$("#outSeg button").forEach(function(x){x.classList.remove("on");});
      this.classList.add("on"); outMode=this.dataset.o; applyOut();
    });
  });
  $("#btnPrint").addEventListener("click", function(){ window.print(); });
  $("#btnReset").addEventListener("click", resetAll);
  $("#btnSample").addEventListener("click", loadSample);
  $("#btnGo").addEventListener("click", function(){
    if(photoOn && engMode!=="man") runRead();
    else render();
    var t=$("#sh_paneA"); if(t) t.scrollIntoView({behavior:"smooth", block:"start"});
  });
  $("#selAll").addEventListener("click", function(){
    DATA.ind.forEach(function(x,i){ sel[x.id]=true; touched[x.id]=true;
      if(!mk[x.id]) mk[x.id]=gridPos(i, DATA.ind.length); });
    buildKb(); render(); });
  $("#selNone").addEventListener("click", function(){
    sel={}; DATA.ind.forEach(function(x){ touched[x.id]=true; });
    buildKb(); render(); });
  initPhoto();
  bindMeta();
  setLang("zh");          /* 병기 기본값 — 중국어 */
  loadSample();
});
})();
</script>
</body></html>
