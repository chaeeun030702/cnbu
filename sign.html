<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>안전 위험 표지 및 문구</title>
<style>
/* 안전 위험 표지 및 문구 (A4 세로) — 작업내용 설명 모드에서 위험 항목마다 표지 1장. 색은 빨강·노랑·흰색(+검정 글자)만 쓴다 */
:root{--red:#D7191C;--yel:#FFD400;--blk:#111}
*{box-sizing:border-box}html,body{margin:0;background:#8b9097;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;color:var(--blk)}
body.embed{background:transparent}
.sheet{width:210mm;height:297mm;background:#fff;margin:0 auto 14px;padding:10mm 10mm 9mm;position:relative;overflow:hidden;box-shadow:0 3px 14px rgba(0,0,0,.4);page-break-after:always;break-after:page;display:flex;flex-direction:column}
.hd{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2.2pt solid var(--red);padding-bottom:2mm;margin-bottom:4mm}
.hd h1{margin:0;font-size:20pt;font-weight:900;letter-spacing:2px}
.hd .tr{display:block;font-size:9pt;color:var(--red);font-weight:700;letter-spacing:0}
.hd .meta{font-size:8.5pt;text-align:right;line-height:1.45}
.hd .meta .tr{display:block;font-size:7.5pt}
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:5mm}
.sg{border:2.2pt solid var(--blk);border-radius:3mm;overflow:hidden;display:flex;flex-direction:column;min-height:0;background:#fff}
.sg .top{background:var(--red);color:#fff;text-align:center;padding:1.6mm 2mm 1.4mm}
.sg .top b{display:block;font-size:22pt;font-weight:900;letter-spacing:6px;line-height:1.05}
.sg .top .tr{display:block;font-size:9pt;font-weight:800;letter-spacing:1px}
.sg .mid{background:var(--yel);display:flex;align-items:center;gap:3mm;padding:2.4mm 3mm;border-top:1.4pt solid var(--blk);border-bottom:1.4pt solid var(--blk)}
.sg .mid svg{flex:none;width:22mm;height:20mm}
.sg .nm{font-size:12.5pt;font-weight:900;line-height:1.25}
.sg .nm .tr{display:block;font-size:8pt;font-weight:700;margin-top:.6mm}
.sg .bot{background:#fff;padding:2mm 3mm;flex:1;min-height:0;overflow:hidden}
.sg .bot .lab{font-size:8.5pt;font-weight:900;color:var(--red)}
.sg .bot .lab .tr{font-size:7pt;margin-left:1.5mm}
.sg .bot ul{margin:.8mm 0 0;padding-left:4.2mm;font-size:9pt;line-height:1.35}
.sg .bot li{margin-bottom:.8mm}
.sg .bot li .tr{display:block;font-size:7.4pt;color:#333}
.sg .rk{float:right;background:var(--red);color:#fff;font-weight:900;font-size:8pt;border-radius:2mm;padding:.2mm 1.6mm;margin-left:1mm}
.ft{margin-top:3mm;font-size:7.2pt;color:#333;display:flex;justify-content:space-between;border-top:.6pt solid #999;padding-top:1.2mm}
.ft .ai{color:var(--red);font-weight:700}
.empty{flex:1;display:flex;align-items:center;justify-content:center;font-size:12pt;color:#555;text-align:center;border:1.4pt dashed #999;border-radius:3mm}
.tr:empty{display:none!important}
[contenteditable=true]{outline:1px dashed #1A73E8;outline-offset:1px}
@page{size:A4 portrait;margin:0}
@media print{html,body{background:#fff}.sheet{margin:0;box-shadow:none}[contenteditable]{outline:none}}
</style></head><body>
<div id="pages"></div>
<script id="strdata">var DATA=null;</script>
<script>
'use strict';
var LANG='zh',ED=false,LI={en:1,zh:2,vi:3,uz:4};
var W={
 title:['안전 위험 표지 및 문구','Safety Danger Signs & Messages','安全危险标志及标语','Biển báo & khẩu hiệu nguy hiểm','Xavf belgilari va ogohlantirishlar'],
 danger:['위 험','DANGER','危险','NGUY HIỂM','XAVF'],
 must:['반드시 지키세요','Always do this','必须遵守','Bắt buộc tuân thủ','Albatta bajaring'],
 site:['현장','Site','现场','Công trường','Obyekt'],
 work:['작업','Work','作业','Công việc','Ish'],
 empty:['작업내용을 설명하면 위험 항목마다 표지가 만들어집니다.','Describe the work to create a sign for each hazard.','说明作业内容后，将为每项危险生成标志。','Mô tả công việc để tạo biển báo cho từng mối nguy.','Ishni tavsiflang — har bir xavf uchun belgi yaratiladi.'],
 ai:['AI는 최초 검토, 최종 판단은 관리감독자가 진행.','AI drafts first; the supervisor makes the final decision.','AI进行初步审查，最终判断由管理监督员作出。','AI rà soát ban đầu, giám sát viên quyết định cuối cùng.','SI dastlabki koʻrib chiqadi, yakuniy qarorni nazoratchi qabul qiladi.']
};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function bi(a,cls){a=a||[];var t=LANG==='ko'?'':(a[LI[LANG]]||'');return '<span class="ko'+(cls?' '+cls:'')+'">'+esc(a[0])+'</span><span class="tr">'+esc(t)+'</span>';}
/* 노랑 바탕 위 검정 테두리 경고 삼각형 — 전기는 번개, 그 밖은 느낌표 */
function pict(elec){var tri='<path d="M50 6 L95 86 L5 86 Z" fill="#FFD400" stroke="#111" stroke-width="7" stroke-linejoin="round"/>';
 var g=elec?'<path d="M55 26 L36 58 L50 58 L44 80 L66 46 L52 46 Z" fill="#111"/>':'<rect x="45" y="30" width="10" height="34" rx="3" fill="#111"/><circle cx="50" cy="74" r="6" fill="#111"/>';
 return '<svg viewBox="0 0 100 92" aria-hidden="true">'+tri+g+'</svg>';}
function card(it){var acts=(it.acts||[]).slice(0,3).map(function(a){return '<li>'+bi(a)+'</li>';}).join('');
 return '<div class="sg"><div class="top"><b>'+esc(W.danger[0])+'</b><span class="tr">'+(LANG==='ko'?'':esc(W.danger[LI[LANG]]))+'</span></div>'
  +'<div class="mid">'+pict(it.elec)+'<div class="nm">'+bi(it.name)+'</div></div>'
  +'<div class="bot"><span class="rk">'+esc(it.id)+' · '+it.v+'</span><div class="lab">'+bi(W.must)+'</div><ul>'+acts+'</ul></div></div>';}
function render(){var d=DATA||{items:[]},items=d.items||[],pg=[],h='';
 for(var i=0;i<items.length;i+=6)pg.push(items.slice(i,i+6));if(!pg.length)pg.push([]);
 pg.forEach(function(list,n){
  h+='<div class="sheet"><div class="hd"><div><h1>'+esc(W.title[0])+'<span class="tr">'+(LANG==='ko'?'':esc(W.title[LI[LANG]]))+'</span></h1></div>'
   +'<div class="meta">'+(d.site?'<div>'+esc(W.site[0])+': <b>'+esc(d.site)+'</b></div>':'')+(d.work?'<div>'+esc(W.work[0])+': <b>'+esc(d.work)+'</b></div>':'')+(d.date?'<div>'+esc(d.date)+'</div>':'')+'</div></div>'
   +(list.length?'<div class="grid">'+list.map(card).join('')+'</div>':'<div class="empty">'+bi(W.empty)+'</div>')
   +'<div class="ft"><span class="ai">'+esc(W.ai[0])+'</span><span>'+(n+1)+' / '+pg.length+' · 색: 빨강(위험)·노랑(경고)·흰색(지킬 사항)</span></div></div>';});
 document.getElementById('pages').innerHTML=h;if(ED)hostEdit(true);}
window.setLang=function(l){LANG=l;render();};
window.hostSign=function(o){DATA=o||{items:[]};if(o&&o.lang)LANG=o.lang;render();return (DATA.items||[]).length;};
function hostEdit(on){ED=!!on;Array.prototype.forEach.call(document.querySelectorAll('.ko,.tr,.meta b'),function(e){if(ED)e.setAttribute('contenteditable','true');else e.removeAttribute('contenteditable');});}
window.hostEdit=hostEdit;
window.hostSave=function(){var was=ED;if(ED)hostEdit(false);document.getElementById('strdata').textContent='var DATA='+JSON.stringify(DATA)+';';
 var h='<!doctype html>\n'+document.documentElement.outerHTML;if(was)hostEdit(true);
 var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html;charset=utf-8'}));a.download='안전_위험_표지_및_문구.html';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);};
window.addEventListener('load',function(){if(/embed=1/.test(location.search))document.body.classList.add('embed');render();try{if(parent!==window&&parent.signReady)parent.signReady();}catch(e){}});
</script>
</body></html>
