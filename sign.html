<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>안전 위험 표지 및 문구</title>
<style>
/* 안전 위험 표지 및 문구 (A4 세로) — 작업내용 설명 모드에서 위험 항목마다 표지 1장. 색은 빨강·노랑·흰색(+검정 글자)만 쓴다 */
:root{--red:#D7191C;--yel:#FFD400;--blk:#111}
*{box-sizing:border-box}html,body{margin:0;background:#8b9097;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;color:var(--blk)}
body.embed{background:transparent}html:has(body.embed){background:transparent!important}
.sheet{width:210mm;height:297mm;background:#fff;margin:0 auto 14px;padding:10mm 10mm 9mm;position:relative;overflow:hidden;box-shadow:0 3px 14px rgba(0,0,0,.4);page-break-after:always;break-after:page;display:flex;flex-direction:column}
.hd{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2.2pt solid var(--red);padding-bottom:2mm;margin-bottom:4mm}
.hd h1{margin:0;font-size:20pt;font-weight:900;letter-spacing:2px}
.hd .tr{display:block;font-size:9pt;color:var(--red);font-weight:700;letter-spacing:0}
.hd .meta{font-size:8.5pt;text-align:right;line-height:1.45}
.hd .meta .tr{display:block;font-size:7.5pt}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,minmax(0,1fr));gap:5mm}
.sg{border:2.2pt solid var(--blk);border-radius:3mm;overflow:hidden;display:flex;flex-direction:column;min-height:0;background:#fff}
.sg .top{background:var(--red);color:#fff;text-align:center;padding:1mm 2mm .8mm}
.sg .top b{display:block;font-size:17pt;font-weight:900;letter-spacing:6px;line-height:1.05}
.sg .top .tr{display:block;font-size:9pt;font-weight:800;letter-spacing:1px}
.sg .mid{background:var(--yel);display:flex;align-items:center;gap:3mm;padding:1.6mm 3mm;border-top:1.4pt solid var(--blk);border-bottom:1.4pt solid var(--blk)}
.sg .mid img.ws{flex:none;width:19mm;height:17mm;object-fit:contain;background:#fff;border-radius:2mm;padding:.6mm}
.sg .nm{font-size:11.5pt;font-weight:900;line-height:1.25}
.sg .nm .tr{display:block;font-size:8pt;font-weight:700;margin-top:.6mm}
.sg .bot{background:#fff;padding:2mm 3mm;flex:1;min-height:0;overflow:hidden}
.sg .bot .lab{font-size:8.5pt;font-weight:900;color:var(--red)}
.sg .bot .lab .tr{font-size:7pt;margin-left:1.5mm}
.sg .ics{display:flex;gap:2.2mm;margin:0 0 1.2mm;flex-wrap:wrap}.sg .ic{width:17mm;text-align:center;font-size:6.6pt;line-height:1.15;font-weight:700}.sg .ic img{display:block;width:10mm;height:10mm;object-fit:contain;margin:0 auto .4mm}.sg .ic .tr{display:block;font-size:5.8pt;font-weight:600;color:#333}
.sg .bot ul{margin:.6mm 0 0;padding-left:4.2mm;font-size:8.2pt;line-height:1.28}
.sg .bot li{margin-bottom:.6mm}.sg .bot li .ko{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.sg .bot li .tr{display:-webkit-box!important;-webkit-box-orient:vertical;-webkit-line-clamp:1;overflow:hidden}
.sg .bot li .tr{display:block;font-size:7.4pt;color:#333}
.sg .rk{float:right;background:var(--red);color:#fff;font-weight:900;font-size:8pt;border-radius:2mm;padding:.2mm 1.6mm;margin-left:1mm}
.ft{margin-top:3mm;font-size:7.2pt;color:#333;display:flex;justify-content:space-between;border-top:.6pt solid #999;padding-top:1.2mm}
.ft .ai{color:var(--red);font-weight:700}
.empty{flex:1;display:flex;align-items:center;justify-content:center;font-size:12pt;color:#555;text-align:center;border:1.4pt dashed #999;border-radius:3mm}
.tr:empty{display:none!important}
[contenteditable=true]{outline:1px dashed #1A73E8;outline-offset:1px}
@page{size:A4 portrait;margin:0}
@media print{html,body{background:#fff}.sheet{margin:0;box-shadow:none}[contenteditable]{outline:none}}

/* 외국어 위 · 한국어 아래 */
.hd .htr{font-size:15pt;font-weight:900;color:var(--red);line-height:1.2;margin-bottom:.6mm}
.sg .top b.fg{font-size:17pt;letter-spacing:2px}
.sg .top b.fg+b.kd{font-size:11pt;letter-spacing:4px;font-weight:800}
.sg .nm .tr{display:block;font-size:10.5pt;font-weight:900;margin:0 0 .5mm}
.sg .nm .tr:not(:empty)+.ko{display:block;font-size:8.5pt;font-weight:800}
.sg .ic .tr{display:block;font-size:6.2pt;font-weight:700;color:#111}.sg .ic .tr:not(:empty)+.ko{display:block;font-size:5.8pt;font-weight:600;color:#333}
.sg .bot .lab .tr{font-size:8pt;margin:0 1.5mm 0 0}
.sg .bot li .tr{display:-webkit-box!important;font-size:7.8pt;color:#111;font-weight:600}
.sg .bot li .tr:not(:empty)+.ko{display:-webkit-box;font-size:7pt;color:#333;-webkit-line-clamp:2}
</style></head><body>
